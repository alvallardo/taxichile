<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaxiChile Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow-x: hidden; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        #map { height: 350px; width: 100%; border-radius: 2rem; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 10; }
        .taxi-anim { display: inline-block; animation: taxiMove 1.5s ease-in-out infinite; font-size: 2.5rem; }
        @keyframes taxiMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .suggestions-container { position: absolute; z-index: 1000; background: white; width: 100%; max-height: 200px; overflow-y: auto; border-radius: 1rem; border: 1px solid #e2e8f0; }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .result-card { background: #0f172a; color: white; border-radius: 2.5rem; display: none; }
        .result-card.show { display: block; }
        .btn-wsp { background-color: #25D366; }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <header class="gradient-bg text-white p-8 shadow-2xl text-center">
            <span class="taxi-anim">🚕</span>
            <h1 class="text-3xl font-black tracking-tighter">TAXICHILE <span class="text-yellow-400">PRO</span></h1>
            <p id="app-tagline" class="text-[11px] uppercase tracking-[0.2em] font-bold text-white/80 mt-1">Calcula, convierte y viaja seguro.</p>
            
            <div class="flex justify-center gap-2 mt-4 bg-white/10 p-1 rounded-xl w-fit mx-auto">
                <button onclick="changeLanguage('es')" id="btn-es" class="px-5 py-2 rounded-lg text-xs font-black transition-all bg-yellow-400 text-slate-900">ESP</button>
                <button onclick="changeLanguage('en')" id="btn-en" class="px-5 py-2 rounded-lg text-xs font-black transition-all text-white">ENG</button>
            </div>
        </header>

        <main class="p-4 space-y-6 max-w-5xl mx-auto w-full">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100">
                <div class="space-y-5">
                    <div>
                        <label id="label-origin" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Origen</label>
                        <div class="flex gap-3">
                            <input type="text" id="origin" readonly class="flex-1 px-5 py-4 bg-slate-50 border-none rounded-2xl text-sm font-bold outline-none" placeholder="GPS">
                            <button onclick="getCurrentLocation()" class="bg-slate-900 text-white p-4 rounded-2xl shadow-xl">🎯</button>
                        </div>
                    </div>
                    <div class="relative">
                        <label id="label-dest" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Destino</label>
                        <input type="text" id="destination" autocomplete="off" class="w-full px-5 py-4 border-2 border-slate-50 rounded-2xl text-sm font-bold outline-none focus:border-yellow-400" placeholder="...">
                        <div id="suggestions" class="suggestions-container hidden"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label id="label-rate" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Tarifa p/km</label>
                            <input type="number" id="tarifa" value="650" class="w-full px-5 py-4 bg-slate-50 rounded-2xl font-black text-sm outline-none" oninput="updateAllPrices()">
                        </div>
                        <div>
                            <label id="label-curr" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Moneda</label>
                            <select id="currency" onchange="updateAllPrices()" class="w-full px-5 py-4 bg-slate-900 text-white rounded-2xl text-xs font-black shadow-lg">
                                <option value="CLP">🇨🇱 CLP</option>
                                <option value="USD">🇺🇸 USD</option>
                                <option value="EUR">🇪🇺 EUR</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultCard" class="result-card p-8 shadow-2xl mx-2">
                <div class="text-center space-y-4">
                    <p id="label-cost" class="text-[10px] text-slate-400 uppercase font-black tracking-widest">Costo Estimado</p>
                    <h2 class="text-5xl font-black tracking-tighter" id="mainPrice">$0</h2>
                    <div class="inline-block bg-yellow-400 text-slate-900 px-4 py-1.5 rounded-full text-xs font-black" id="secondaryPrice">0.00 USD</div>
                    
                    <div class="grid grid-cols-2 gap-4 pt-6 border-t border-white/10 mt-6 text-sm font-bold">
                        <div><p id="label-dist">Distancia</p><p id="distance">0 km</p></div>
                        <div><p id="label-time">Tiempo</p><p id="duration">0 min</p></div>
                    </div>

                    <button onclick="shareByWhatsApp()" class="w-full btn-wsp text-white py-4 rounded-2xl font-black flex items-center justify-center gap-2 shadow-xl mt-4">
                        <span class="text-xl">💬</span> <span id="label-wsp">Enviar por WhatsApp</span>
                    </button>
                </div>
            </div>

            <div class="pb-12"><div id="map"></div></div>
        </main>
    </div>

    <script>
        let map, originMarker, destinationMarker, routeLine, userLocation, lastDistance, rates = {};
        let currentLang = 'es';
        
        const texts = {
            es: { tagline: "Calcula, convierte y viaja seguro.", origin: "Origen", dest: "Destino", rate: "Tarifa p/km", curr: "Moneda", cost: "Costo Estimado", dist: "Distancia", time: "Tiempo", wsp: "Enviar por WhatsApp", placeholder_dest: "¿A dónde vas?", msg_wsp: "Hola, calculé mi viaje en TaxiChile Pro:" },
            en: { tagline: "Calculate, convert and travel safe.", origin: "Starting Point", dest: "Destination", rate: "Rate p/km", curr: "Currency", cost: "Estimated Cost", dist: "Distance", time: "Estimated Time", wsp: "Send via WhatsApp", placeholder_dest: "Where to?", msg_wsp: "Hi, I calculated my trip on TaxiChile Pro:" }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            // Botones
            document.getElementById('btn-es').className = `px-5 py-2 rounded-lg text-xs font-black transition-all ${lang === 'es' ? 'bg-yellow-400 text-slate-900' : 'text-white'}`;
            document.getElementById('btn-en').className = `px-5 py-2 rounded-lg text-xs font-black transition-all ${lang === 'en' ? 'bg-yellow-400 text-slate-900' : 'text-white'}`;
            
            // Textos
            document.getElementById('app-tagline').innerText = texts[lang].tagline;
            document.getElementById('label-origin').innerText = texts[lang].origin;
            document.getElementById('label-dest').innerText = texts[lang].dest;
            document.getElementById('label-rate').innerText = texts[lang].rate;
            document.getElementById('label-curr').innerText = texts[lang].curr;
            document.getElementById('label-cost').innerText = texts[lang].cost;
            document.getElementById('label-dist').innerText = texts[lang].dist;
            document.getElementById('label-time').innerText = texts[lang].time;
            document.getElementById('label-wsp').innerText = texts[lang].wsp;
            document.getElementById('destination').placeholder = texts[lang].placeholder_dest;
            
            updateAllPrices();
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-33.44, -70.66], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            fetchRates();
            changeLanguage('es');
        }

        async function fetchRates() {
            try { const r = await fetch('https://open.er-api.com/v6/latest/CLP'); const d = await r.json(); rates = d.rates; } catch(e){}
        }

        function getCurrentLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                map.setView([userLocation.lat, userLocation.lng], 16);
                if (originMarker) map.removeLayer(originMarker);
                originMarker = L.marker([userLocation.lat, userLocation.lng]).addTo(map);
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocation.lat}&lon=${userLocation.lng}&addressdetails=1`)
                    .then(r => r.json()).then(d => {
                        const a = d.address;
                        document.getElementById('origin').value = `${a.road || ''} ${a.house_number || ''}, ${a.city || ''}`;
                    });
            }, null, { enableHighAccuracy: true });
        }

        const destInput = document.getElementById('destination');
        const suggestBox = document.getElementById('suggestions');
        destInput.addEventListener('input', () => {
            if (destInput.value.length < 3) return suggestBox.classList.add('hidden');
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destInput.value)}&countrycodes=cl&limit=5&addressdetails=1`)
                .then(r => r.json()).then(data => {
                    suggestBox.innerHTML = '';
                    data.forEach(p => {
                        const d = document.createElement('div');
                        d.className = 'suggestion-item';
                        d.innerHTML = `<p class="font-bold text-sm">${p.address.road || p.display_name.split(',')[0]}</p><p class="text-[10px] opacity-40">${p.display_name.split(',').slice(1,3).join(',')}</p>`;
                        d.onclick = () => { destInput.value = p.display_name; suggestBox.classList.add('hidden'); calculateRoute(p.lat, p.lon); };
                        suggestBox.appendChild(d);
                    });
                    suggestBox.classList.remove('hidden');
                });
        });

        async function calculateRoute(lat, lng) {
            if (!userLocation) return;
            const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${userLocation.lng},${userLocation.lat};${lng},${lat}?overview=full&geometries=geojson`);
            const d = await r.json();
            if (d.code === 'Ok') {
                const rt = d.routes[0];
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.geoJSON(rt.geometry, { style: { color: '#fbbf24', weight: 6 } }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                if (destinationMarker) map.removeLayer(destinationMarker);
                destinationMarker = L.marker([lat, lng]).addTo(map);
                lastDistance = rt.distance / 1000;
                document.getElementById('distance').innerText = lastDistance.toFixed(1) + ' km';
                document.getElementById('duration').innerText = Math.round(rt.duration/60) + ' min';
                document.getElementById('resultCard').classList.add('show');
                updateAllPrices();
            }
        }

        function updateAllPrices() {
            if (!lastDistance) return;
            const p = Math.round(lastDistance * document.getElementById('tarifa').value);
            const c = document.getElementById('currency').value;
            document.getElementById('mainPrice').innerText = `$${p.toLocaleString('es-CL')}`;
            const symbols = { USD: 'US$', EUR: '€' };
            document.getElementById('secondaryPrice').innerText = c === 'CLP' ? "LOCAL" : `${symbols[c]||'$'} ${(p * (rates[c]||0)).toFixed(2)} ${c}`;
        }

        function shareByWhatsApp() {
            const origin = document.getElementById('origin').value;
            const dest = document.getElementById('destination').value;
            const price = document.getElementById('mainPrice').innerText;
            const text = `${texts[currentLang].msg_wsp}%0A📍 *${texts[currentLang].origin}:* ${origin}%0A🏁 *${texts[currentLang].dest}:* ${dest}%0A💰 *${texts[currentLang].cost}:* ${price}`;
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        window.onload = initMap;
    </script>
</body>
</html>
